<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="jrGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A8EB12" />
      <stop offset="100%" stop-color="#008894" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Scissors & Barber Razor Motif Icon -->
  <g transform="translate(15, 12)">
    <!-- Shield / Badge background -->
    <rect x="0" y="0" width="96" height="96" rx="22" fill="#044000" stroke="#A8EB12" stroke-width="2.5" />
    
    <!-- Stylized Crossed Shears / Razor blades -->
    <path d="M 28 72 L 68 24 M 68 72 L 28 24" stroke="#eae5d8" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="28" cy="72" r="7" fill="none" stroke="#A8EB12" stroke-width="3" />
    <circle cx="68" cy="72" r="7" fill="none" stroke="#A8EB12" stroke-width="3" />
    <circle cx="48" cy="48" r="4.5" fill="#008894" />
    <path d="M 38 20 C 48 14 58 20 58 24 L 38 24 Z" fill="#A8EB12" />
  </g>

  <!-- Typography: J&R -->
  <text x="130" y="68" font-family="'Montserrat', 'Outfit', 'Inter', sans-serif" font-weight="900" font-size="52" fill="#eae5d8" letter-spacing="1">
    J<tspan fill="#A8EB12">&amp;</tspan>R
  </text>
  
  <!-- Subtitle -->
  <text x="132" y="94" font-family="'Inter', sans-serif" font-weight="600" font-size="14" fill="#008894" letter-spacing="4">
    BARBEARIA EXCLUSIVA
  </text>

  <!-- Independent barbers tag -->
  <g transform="translate(365, 36)">
    <rect x="0" y="0" width="120" height="28" rx="14" fill="#191d0e" stroke="#008894" stroke-width="1.2" />
    <circle cx="16" cy="14" r="4" fill="#A8EB12" />
    <text x="28" y="19" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#eae5d8">JULIANO &amp; ROBERT</text>
  </g>
</svg>
